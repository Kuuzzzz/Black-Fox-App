<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Black Fox Center</title>
<meta name="theme-color" content="#05070A">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icons/fox-192.png">
<link rel="apple-touch-icon" href="/icons/fox-180.png">
<style>body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="/bridge.js?v=6"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar, one content column (max 1320px) that splits into main + side from 1024px; phones get a bottom tab bar. Deliberately dark-only, as Heng asked. */
:root {
  --bg: #05070A;
  --card: #0B1117;
  --card2: #101922;
  --line: #17222C;
  --line2: #22313D;
  --accent: #4FD8FF;
  --accent-ink: #041016;
  --accent-dim: rgba(79, 216, 255, 0.14);
  --accent-glow: rgba(79, 216, 255, 0.35);
  --hi: #B5F3FF;
  --warn: #FFB86B;
  --warn-dim: rgba(255, 184, 107, 0.14);
  --warn-ink: #FFE2C2;
  --bad: #FF7A8A;
  --bad-dim: rgba(255, 122, 138, 0.14);
  --good: #7CF2C3;
  --good-dim: rgba(124, 242, 195, 0.13);
  --text: #E6F1F7;
  --muted: #8A9BA8;
  --muted2: #9AABB8;
  --field: #070B0F;
  --chip-dim: #121B24;
  --shade: rgba(0, 0, 0, 0.62);
  --head: 'Rajdhani', 'Arial Narrow', 'Segoe UI', sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 18px;
  --r-sm: 12px;
  --top: 64px;
  --tab: 66px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
@media (min-width: 768px) { :root { --gut: max(28px, env(safe-area-inset-left, 0px)); --gut-r: max(28px, env(safe-area-inset-right, 0px)); } }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font: 400 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Top bar and phone tab bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--top); display: flex; align-items: center; gap: 16px; padding-left: var(--gut); padding-right: var(--gut-r); background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand img { width: 34px; height: 34px; display: block; border-radius: 9px; filter: drop-shadow(0 0 8px var(--accent-glow)); }
.word { font: 700 17px/1 var(--head); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
.word span { color: var(--accent); }
.topnav { display: none; gap: 4px; margin-left: 10px; }
.topnav a { padding: 9px 14px; border-radius: 999px; color: var(--muted2); font: 600 15px/1 var(--head); letter-spacing: 0.08em; text-transform: uppercase; }
.topnav a:hover { color: var(--text); text-decoration: none; }
.topnav a.on { color: var(--accent-ink); background: var(--accent); box-shadow: 0 0 18px var(--accent-glow); }
.me { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.me .who { display: none; text-align: right; line-height: 1.2; }
.me .who b { display: block; font-weight: 600; }
.me .who small { color: var(--muted); font-size: 12px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; padding: 0 var(--gut-r) env(safe-area-inset-bottom, 0px) var(--gut); height: calc(var(--tab) + env(safe-area-inset-bottom, 0px)); background: rgba(8, 12, 16, 0.95); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font: 600 11px/1 var(--head); letter-spacing: 0.08em; text-transform: uppercase; }
.tabbar a:hover { text-decoration: none; }
.tabbar svg { width: 22px; height: 22px; }
.tabbar a.on { color: var(--accent); }
.tabbar a.on svg { filter: drop-shadow(0 0 6px var(--accent-glow)); }
.view { max-width: 1376px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut-r); padding-block: 18px calc(var(--tab) + 32px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 768px) {
  .topnav { display: flex; }
  .tabbar { display: none; }
  .view { padding-block: 28px 56px; }
  .me .who { display: block; }
}
@media (min-width: 768px) and (max-width: 1060px) { .topbar .word { display: none; } .topnav a { padding: 9px 11px; font-size: 14px; } }

/* Type */
h1, h2, h3 { font-family: var(--head); margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.h-xl { font: 700 34px/1.02 var(--head); text-transform: uppercase; letter-spacing: 0.03em; }
.h-xl em { font-style: normal; color: var(--accent); text-shadow: 0 0 22px var(--accent-glow); }
.h-lg { font: 700 22px/1.1 var(--head); text-transform: uppercase; letter-spacing: 0.05em; }
.h-md { font: 700 18px/1.15 var(--head); letter-spacing: 0.03em; }
.eyebrow { font: 600 12px/1.2 var(--head); letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pre { white-space: pre-wrap; }
.num { font-variant-numeric: tabular-nums; }
@media (min-width: 1024px) { .h-xl { font-size: 44px; } }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head > div:first-child { min-width: 0; }
.page-head .sub { color: var(--muted2); margin-top: 8px; max-width: 62ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Layout */
.cols-main, .cols-2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.grid-cards { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .grid-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .grid-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .cols-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; } }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.glow { border-color: rgba(79, 216, 255, 0.35); box-shadow: 0 0 0 1px rgba(79, 216, 255, 0.08), 0 10px 40px -18px var(--accent-glow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2 { font: 700 16px/1.1 var(--head); text-transform: uppercase; letter-spacing: 0.08em; }
.list > .item { padding: 12px 0; border-top: 1px solid var(--line); }
.list > .item:first-child { border-top: 0; padding-top: 2px; }
.item-title { font-weight: 600; }
.item-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
.empty { color: var(--muted); padding: 18px 6px; text-align: center; font-size: 13px; }
.empty b { display: block; color: var(--text); font: 700 16px/1.2 var(--head); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }

/* Halo stats */
.halos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.halo { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--text); min-width: 0; }
.halo:hover { border-color: var(--line2); text-decoration: none; }
.ring { position: relative; width: 62px; height: 62px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 23px/1 var(--head); font-variant-numeric: tabular-nums; }
.halo span { font: 600 11px/1.2 var(--head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted2); }
.halo.warn b { color: var(--warn); }
@media (min-width: 768px) { .halos { gap: 14px; } .halo { flex-direction: row; justify-content: flex-start; padding: 16px 18px; text-align: left; } .halo span { font-size: 13px; } }

/* Chips and avatars */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font: 600 11px/1 var(--head); letter-spacing: 0.1em; text-transform: uppercase; background: var(--accent-dim); color: var(--accent); white-space: nowrap; border: 0; }
.chip.warn { background: var(--warn-dim); color: var(--warn); }
.chip.bad { background: var(--bad-dim); color: var(--bad); }
.chip.good { background: var(--good-dim); color: var(--good); }
.chip.dim { background: var(--chip-dim); color: var(--muted2); }
.chip.solid { background: var(--accent); color: var(--accent-ink); }
button.chip { cursor: pointer; }
.av { width: 30px; height: 30px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 12px/1 var(--head); letter-spacing: 0.04em; background: #0F2430; color: var(--hi); border: 1px solid rgba(79, 216, 255, 0.35); }
.av.lg { width: 38px; height: 38px; font-size: 14px; }
.avs { display: flex; }
.avs .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--card); }
.avs .av:first-child { margin-left: 0; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card2); color: var(--text); font: 700 14px/1 var(--head); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.btn:hover { border-color: var(--accent); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 22px -4px var(--accent-glow); }
.btn.primary:hover { background: var(--hi); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); padding: 0 8px; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12px; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }
.btn svg { width: 16px; height: 16px; }
.btn.icon-only { width: 32px; padding: 0; color: var(--muted2); }
.btn.icon-only:hover { color: var(--bad); border-color: var(--bad-dim); }
.icon-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line2); background: var(--card2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-width: 0; }
.field > label, .label { font: 600 12px/1.1 var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted2); }
.input { width: 100%; min-height: 42px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: var(--field); color: var(--text); }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%); background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; color: var(--muted); }
.search .input { padding-left: 38px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--field); border: 1px solid var(--line2); }
.seg button { border: 0; background: none; height: 32px; padding: 0 13px; border-radius: 999px; color: var(--muted2); font: 700 13px/1 var(--head); letter-spacing: 0.1em; text-transform: uppercase; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted2); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Inbox */
.mail { padding: 13px 0; border-top: 1px solid var(--line); }
.mail:first-child { border-top: 0; padding-top: 2px; }
.mail .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.mail .when { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.mail .subj { font-weight: 600; overflow-wrap: anywhere; }
.mail.unread .subj::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); margin-right: 7px; vertical-align: 2px; }
.mail .meta { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
.mail .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.next-box { font-size: 12.5px; color: var(--hi); background: rgba(79, 216, 255, 0.06); border-left: 2px solid var(--accent); padding: 7px 10px; border-radius: 0 8px 8px 0; margin-top: 8px; white-space: pre-wrap; }

/* Clients */
.client-label { font: 600 12px/1 var(--head); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 24px 0 10px; display: flex; align-items: center; gap: 10px; }
.client-label:first-child { margin-top: 4px; }
.client-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.counts { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
.proj-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 0 -12px; border-radius: 12px; color: var(--text); }
.proj-row:hover { background: var(--card2); text-decoration: none; }
.proj-row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-steps { display: flex; gap: 3px; flex: none; }
.mini-steps i { width: 9px; height: 4px; border-radius: 2px; background: var(--line2); }
.mini-steps i.on { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

/* Project */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted2); margin-bottom: 12px; font: 600 13px/1 var(--head); letter-spacing: 0.12em; text-transform: uppercase; }
.back svg { width: 16px; height: 16px; }
.back:hover { color: var(--accent); text-decoration: none; }
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; position: relative; }
.step { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--muted); min-width: 0; }
.step .node { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--line2); font: 700 14px/1 var(--head); background: var(--bg); }
.step.done .node { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.step.now .node { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 5px var(--accent-dim), 0 0 20px var(--accent-glow); }
.step span { font: 600 10px/1.1 var(--head); letter-spacing: 0.06em; text-transform: uppercase; overflow-wrap: anywhere; }
.step.now span, .step.done span { color: var(--text); }
.step:hover .node { border-color: var(--accent); }
@media (min-width: 768px) { .step span { font-size: 12px; } .step .node { width: 40px; height: 40px; } }
.stage-note { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted2); font-size: 13px; }
.stage-note b { color: var(--text); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.facts .label { margin-bottom: 5px; display: block; }
.facts .val { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
.facts .wide { grid-column: 1 / -1; }
.links { display: grid; gap: 8px; }
.link-tile { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); color: var(--text); text-align: left; width: 100%; }
.link-tile:hover { border-color: var(--accent); text-decoration: none; }
.link-tile .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
.link-tile .ic svg { width: 18px; height: 18px; }
.link-tile small { display: block; color: var(--muted); font-size: 12px; }
.link-tile > svg, .proj-row > svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
.link-tile.missing { color: var(--muted); border-style: dashed; }
.link-tile.missing .ic { background: var(--chip-dim); color: var(--muted); }
.ms { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.ms:first-child { border-top: 0; }
.ms .nm { font-weight: 600; }
.ms .mt { color: var(--muted); font-size: 12px; }
.ms .rt { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.ms .days { font: 700 13px/1 var(--head); letter-spacing: 0.06em; color: var(--muted2); white-space: nowrap; }
.ms .days.late { color: var(--bad); }
.ms .days.soon { color: var(--warn); }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--hi)); box-shadow: 0 0 10px var(--accent-glow); }
details.done-list summary { cursor: pointer; color: var(--muted2); font: 600 13px/1 var(--head); letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 0 4px; border-top: 1px solid var(--line); list-style: none; }
details.done-list summary::-webkit-details-marker { display: none; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.kv b { color: var(--text); font-weight: 600; }
.update { padding: 12px 0; border-top: 1px solid var(--line); }
.update:first-child { border-top: 0; padding-top: 0; }
.update .lbl { font: 600 11px/1 var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 9px 0 3px; }
.update .lbl.next { color: var(--warn); }
.update p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Team WIP */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters select.input { width: auto; min-width: 170px; }
.lanes { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) { .lanes.two { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.lane-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.wip-card { position: relative; }
.wip-card .card-del { position: absolute; top: 12px; right: 12px; }
.wip-card .card-del + .client, .wip-card .card-del ~ .name { padding-right: 36px; }
.wip-card .client { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.wip-card .name { font: 700 17px/1.2 var(--head); letter-spacing: 0.02em; margin-top: 2px; color: var(--text); display: block; }
.wip-card .name:hover { color: var(--accent); text-decoration: none; }
.wip-card .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.wks { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
@media (min-width: 560px) { .wks { grid-template-columns: 1fr 1fr; } }
.wk { border-radius: 10px; padding: 8px 10px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--line); min-width: 0; }

.wk-l { font: 600 10.5px/1 var(--head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--good); margin: 6px 0 3px; }
.wk-l.nx { color: var(--warn); }
.wk-t { font-size: 12.5px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.wk.prev .wk-t { color: var(--muted2); }

/* Calendar */
.cal-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.cal-bar .date { font: 700 18px/1 var(--head); letter-spacing: 0.05em; text-transform: uppercase; margin: 0 6px; }

.deadline { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--warn-dim); color: var(--warn); font-size: 12px; border: 1px solid rgba(255, 184, 107, 0.25); }
.deadline:hover { text-decoration: none; border-color: var(--warn); }

.day-person { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }

.evs { display: flex; flex-wrap: wrap; gap: 6px; }
.ev { display: block; padding: 6px 10px; border-radius: 10px; background: var(--accent-dim); border-left: 3px solid var(--accent); font-size: 12px; color: var(--text); overflow-wrap: anywhere; }
.ev:hover { text-decoration: none; background: rgba(79, 216, 255, 0.22); }
.ev b { display: block; font-family: var(--head); letter-spacing: 0.05em; color: var(--hi); }

.ev-wrap { position: relative; display: block; }
.ev.has-del { padding-right: 34px; }
.ev-del { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--muted2); }
.ev-del svg { width: 15px; height: 15px; }
.ev-del:hover { color: var(--bad); background: var(--bad-dim); }
.rooms { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); margin-top: 8px; }
.room-opt { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; min-height: 54px; border-radius: 14px; background: var(--field); border: 1px solid var(--line2); color: var(--text); cursor: pointer; font: inherit; }
.room-opt > svg { width: 18px; height: 18px; flex: none; color: var(--muted2); }
.room-opt b { display: block; font-size: 13px; }
.room-opt .em { display: block; font-size: 12px; color: var(--muted2); margin-top: 2px; }
.room-opt.free .em { color: var(--good); }
.room-opt.busy .em { color: var(--warn); }
.room-opt.on { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px rgba(79, 216, 255, 0.18); }
.room-opt.on > svg { color: var(--accent); }
.room-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rooms-card { margin-top: 14px; }
.client-label.am-label { color: var(--accent); }
.client-label.am-label::after { order: 1; }
.client-label.am-label > button { order: 2; text-transform: uppercase; }
details.lesson summary { cursor: pointer; color: var(--muted); margin-top: 8px; list-style: none; }
details.lesson summary::-webkit-details-marker { display: none; }
details.lesson summary b { color: var(--accent); font-weight: 600; }
details.lesson[open] summary { display: none; }
.rooms-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.av > svg { width: 15px; height: 15px; }
.cell-add { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; border: 1px dashed var(--line2); background: none; color: var(--muted2); cursor: pointer; }
.cell-add:hover { color: var(--accent); border-color: var(--accent); }
.cell-add > svg { width: 14px; height: 14px; }
@media (max-width: 560px) { .day-person { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
.week-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.week { display: grid; grid-template-columns: 140px repeat(7, minmax(112px, 1fr)); min-width: 940px; }
.week > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; min-height: 64px; min-width: 0; }
.week .wh { min-height: auto; font: 700 12px/1.2 var(--head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted2); background: #081016; }

.week .cell .ev { margin-bottom: 4px; padding: 4px 7px; }
.week .cell.today { background: rgba(79, 216, 255, 0.035); }

/* People picker */
.picker { border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--field); }
.picker-btn { width: 100%; min-height: 42px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: none; border: 0; text-align: left; color: var(--text); }
.picker-btn svg { width: 16px; height: 16px; color: var(--accent); }
.picker-panel { border-top: 1px solid var(--line2); padding: 8px; max-height: 300px; overflow: auto; }
.pick { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; }
.pick:hover { background: var(--card2); }
.pick input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.pick .em { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.pick-group { font: 600 11px/1 var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 4px; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
.picked:empty { display: none; }

/* Sheet (modal) */
.sheet-backdrop { position: fixed; inset: 0; background: var(--shade); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto; background: var(--card); border: 1px solid var(--line2); border-radius: 22px 22px 0 0; padding: 18px var(--gut-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gut); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6); }
.sheet::before { content: ""; display: block; width: 44px; height: 4px; border-radius: 2px; background: var(--line2); margin: -6px auto 14px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
.sheet p { margin: 0 0 10px; color: var(--muted2); }
.sheet ol { margin: 0 0 12px; padding-left: 20px; color: var(--muted2); }
.sheet ol li { margin: 4px 0; }
.sheet ol b { color: var(--text); }
.sheet hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
@media (min-width: 768px) {
  .sheet { left: 50%; top: 50%; bottom: auto; right: auto; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 48px)); border-radius: 22px; padding: 24px; }
  .sheet::before { display: none; }
}

/* Toast, banners, loading */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 14px; background: #0E1B23; border: 1px solid rgba(79, 216, 255, 0.4); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); font-weight: 500; }
.toast.err { border-color: rgba(255, 122, 138, 0.5); color: #FFD3D9; }
@media (min-width: 768px) { .toast { bottom: 24px; } }
.skel { border-radius: 10px; background: linear-gradient(90deg, #0C141B 0%, #13202A 50%, #0C141B 100%); background-size: 200% 100%; animation: sk 1.3s infinite linear; height: 14px; margin: 12px 0; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--warn-dim); color: var(--warn-ink); border: 1px solid rgba(255, 184, 107, 0.25); font-size: 13px; margin-bottom: 14px; }
.banner.info { background: var(--accent-dim); color: var(--hi); border-color: rgba(79, 216, 255, 0.25); }
.banner .grow { min-width: 0; }
.lock { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.lock svg { width: 13px; height: 13px; flex: none; }
.hero-fox { display: flex; align-items: center; gap: 18px; }
.hero-fox .mark img { width: 72px; height: 72px; display: block; border-radius: 18px; filter: drop-shadow(0 0 14px var(--accent-glow)); }
@media (max-width: 520px) { .hero-fox .mark { display: none; } }

/* AM Brief Studio, online */
.brief-steps { display: grid; gap: 0; }

.brief-step:first-child { border-top: 0; padding-top: 2px; }
.brief-step .node { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--accent); color: var(--accent); background: var(--accent-dim); font: 700 14px/1 var(--head); }
.brief-step b { display: block; font: 700 16px/1.2 var(--head); letter-spacing: 0.04em; text-transform: uppercase; }
.brief-step p { margin: 4px 0 0; color: var(--muted2); font-size: 13px; }

.brief-folder:first-child { border-top: 0; padding-top: 2px; }

.bs-sec { padding: 14px 0 2px; border-top: 1px solid var(--line); }
.bs-sec:first-of-type { border-top: 0; padding-top: 0; }
.bs-sec .h-md { display: block; margin-bottom: 8px; }
.bs-sec .row .h-md { margin-bottom: 0; }
.bs-sec > .row { margin-bottom: 8px; }
select.input.bs-status { width: auto; min-height: 32px; padding: 4px 34px 4px 12px; border-radius: 999px; font: 700 12px/1 var(--head); letter-spacing: 0.1em; text-transform: uppercase; }
.bs-status.st-clear { color: var(--good); border-color: rgba(124, 242, 195, 0.4); }
.bs-status.st-partial { color: var(--warn); border-color: rgba(255, 184, 107, 0.4); }
.bs-status.st-missing { color: var(--bad); border-color: rgba(255, 122, 138, 0.4); }
.bs-bar { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); gap: 8px; }
.bs-q { display: grid; grid-template-columns: 28px minmax(0, 1fr) 34px; gap: 8px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.bs-q:first-of-type { border-top: 0; }
.bs-q .input + .input { margin-top: 6px; }
.node-sm { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; border: 1px solid var(--line2); color: var(--muted2); font: 700 12px/1 var(--head); margin-top: 6px; }
.icon-btn.sm-ic { width: 34px; height: 34px; }
.icon-btn.sm-ic svg { width: 15px; height: 15px; }
select.input.sm-in { min-height: 34px; padding: 6px 34px 6px 10px; font-size: 12px; color: var(--muted2); }
.bs-opts { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .bs-opts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.bs-opt { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--field); border: 1px solid var(--line2); color: var(--text); cursor: pointer; font: inherit; }
.bs-opt b { font: 700 16px/1.2 var(--head); letter-spacing: 0.02em; }
.bs-opt span { color: var(--muted2); font-size: 12.5px; }
.bs-opt:hover { border-color: var(--accent); }
.bs-opt.on { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px rgba(79, 216, 255, 0.18); }
.bs-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bs-slide, .bs-item { padding: 14px 0; border-top: 1px solid var(--line); }
.bs-slide:first-of-type { border-top: 0; }
.bs-slide > .row { margin-bottom: 8px; }
.input.bs-title { font: 700 17px/1.2 var(--head); letter-spacing: 0.02em; }
.bs-qsec { padding: 6px 0 10px; border-top: 1px solid var(--line2); }
.bs-qsec:first-of-type { border-top: 0; }
.bs-qsec > .row { padding: 8px 0 2px; }
.bs-item { display: grid; gap: 8px; padding: 10px 0; }
.bs-item .field { margin-bottom: 0; }
.bs-results { margin-top: 8px; border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 4px 10px; background: var(--field); }
/* Fox mode: Kuro on a small always-on-top window */
body.fox-on .topbar, body.fox-on .tabbar { display: none; }
body.fox-on .view { padding: 0; max-width: none; }
body.fox-on { overflow: hidden; }
.fox-stage { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 120%, rgba(79, 216, 255, 0.10), transparent 60%), var(--bg); }
.fox-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; border-top: 1px solid rgba(79, 216, 255, 0.35); box-shadow: 0 -6px 18px -10px var(--accent-glow); background: linear-gradient(rgba(79, 216, 255, 0.06), transparent); }
.fox-kuro { position: absolute; left: 0; bottom: 6px; height: clamp(64px, 46vh, 128px); padding: 0; border: 0; background: none; cursor: pointer; display: block; }
.fox-kuro.s-sleep { height: clamp(44px, 30vh, 80px); }
.fox-kuro.s-leap { height: clamp(56px, 40vh, 104px); }
.fox-kuro.s-stretch { height: clamp(42px, 30vh, 84px); }
.fox-kuro.s-run { height: clamp(44px, 32vh, 88px); }
.fox-flip { display: block; height: 100%; }
.fox-kuro img { height: 100%; width: auto; display: block; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6)); }
.fox-kuro.walking img { animation: none; }
.fox-kuro.s-leap img { animation: foxLeap 0.9s ease-in-out 2; }
.fox-kuro.s-sleep img { animation: foxBreathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.fox-kuro:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 12px; }
@keyframes foxBob { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-5px) rotate(1deg); } }
@keyframes foxLeap { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-28%); } }
@keyframes foxBreathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.04); } }
.fox-zzz { position: absolute; right: -6px; top: -14px; color: var(--accent); font: 700 13px var(--head); letter-spacing: 0.2em; animation: foxZ 2.4s ease-in-out infinite; }
@keyframes foxZ { 0%, 100% { opacity: 0.3; transform: translateY(4px); } 50% { opacity: 1; transform: translateY(-4px); } }
.fox-bubble { position: absolute; bottom: 14px; left: 0; display: flex; gap: 12px; align-items: flex-start; width: max-content; max-width: min(480px, calc(100vw - 24px)); padding: 10px 14px 10px 10px; border-radius: 16px; background: #F4F8FB; color: #0B1117; box-shadow: 0 0 26px -6px var(--accent-glow), 0 10px 30px rgba(0, 0, 0, 0.5); animation: foxPop 0.25s ease-out; }
.fox-bubble.urgent { box-shadow: 0 0 0 2px var(--accent), 0 0 30px -4px var(--accent-glow), 0 10px 30px rgba(0, 0, 0, 0.5); }
@keyframes foxPop { from { transform: translateY(8px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
.fox-face { position: relative; flex: none; width: 54px; height: 54px; }
.fox-face img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); display: block; }
.fox-badge { position: absolute; right: -6px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%; background: #0B1117; border: 1.5px solid var(--accent); display: flex; align-items: center; justify-content: center; }
.fox-badge svg { width: 14px; height: 14px; fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.fox-msg { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fox-msg b { font: 700 15px/1.25 var(--head); letter-spacing: 0.02em; }
.fox-msg span { font-size: 13px; line-height: 1.35; color: #33424E; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fox-msg ol { margin: 4px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.4; color: #33424E; }
.fox-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.fox-acts .btn { height: 30px; padding: 0 12px; font-size: 12px; }
.fox-acts .btn.ghost { color: #33424E; border-color: #C9D5DE; background: transparent; }
.fox-acts .btn:not(.primary):not(.ghost) { background: #E2EAF0; color: #0B1117; border-color: #C9D5DE; }
.fox-tools { position: absolute; top: 6px; right: 8px; display: flex; gap: 6px; align-items: center; opacity: 0.45; transition: opacity 0.2s; z-index: 2; }
.fox-stage:hover .fox-tools, .fox-tools:focus-within { opacity: 1; }
.fox-sel { height: 30px; padding: 0 8px; font-size: 12px; width: auto; }
.fox-ic { width: 30px; height: 30px; font: 700 13px var(--head); }
.fox-ic svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fox-hint { position: absolute; top: 8px; left: 10px; right: 200px; font-size: 12px; color: var(--muted); }
.fox-back { position: fixed; right: 16px; bottom: calc(var(--tab) + 16px); z-index: 40; display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--card); border: 1px solid var(--accent); color: var(--text); font: 700 13px var(--head); letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 0 22px -6px var(--accent-glow); }
.fox-back img { width: 30px; height: 30px; border-radius: 50%; }
.fox-back:hover { text-decoration: none; }
@media (min-width: 768px) { .fox-back { bottom: 16px; } }
/* Roaming Kuro: strolls along the bottom of every page except the Kuro tab */
.roam { position: fixed; left: 0; right: 0; bottom: calc(var(--tab) + env(safe-area-inset-bottom, 0px)); height: 0; z-index: 25; pointer-events: none; }
.roam[hidden] { display: none; }
.roam-kuro { position: absolute; left: 0; bottom: 2px; height: 76px; padding: 0; border: 0; background: none; cursor: pointer; pointer-events: auto; display: block; }
.roam-kuro.s-sleep { height: 48px; }
.roam-kuro.s-leap { height: 62px; }
.roam-kuro.s-stretch { height: 50px; }
.roam-kuro.s-run { height: 52px; }
.roam-kuro img { height: 100%; width: auto; display: block; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6)); }
.roam-kuro.s-sleep img { animation: foxBreathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.roam-kuro:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 12px; }
.roam .fox-zzz { right: -4px; top: -12px; }
.roam-bub.fox-bubble { bottom: 86px; pointer-events: auto; }

@media (min-width: 768px) { .roam { bottom: 0; } body.roam-on .view { padding-bottom: 110px; } body.roam-on .fox-back { bottom: 96px; } }
.bs-up { cursor: pointer; position: relative; }
.bs-tidybar { gap: 10px; margin: -6px 0 14px; }
.bs-tidybar svg, .bs-up svg { width: 16px; height: 16px; }
.bs-tidy { margin: -4px 0 16px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: var(--r-sm); background: var(--field); box-shadow: 0 0 18px -8px var(--accent-glow); }
.bs-tidy-text { white-space: pre-wrap; margin-top: 8px; line-height: 1.55; max-height: 360px; overflow: auto; overflow-wrap: anywhere; }
.bs-up:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.bs-up.is-off { opacity: 0.5; pointer-events: none; }

/* The two WIP sheet columns for a project: previous week and next week, each with done + next steps */
function weeks(p) {

  else if ((w.done || w.next) && String(w.syncedAt || '') <= String(u.date)) prev = { done: w.done || '', next: w.next || '' };
